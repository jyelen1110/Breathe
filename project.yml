name: Breathe
options:
  bundleIdPrefix: com.jyelen
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:
  BreatheiOS:
    type: application
    platform: iOS
    sources:
      - BreatheiOS
      - Shared
    dependencies:
      - target: BreatheWatch
    scheme: {}
    entitlements:
      path: BreatheiOS/BreatheiOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: BreatheiOS/Info.plist
      properties:
        CFBundleDisplayName: Breathe
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Breathe reads your heart rate, heart rate variability, resting heart rate, respiratory rate and steps to detect early signs of stress and show your trends.
        NSHealthUpdateUsageDescription: Breathe saves monitoring sessions as workouts so your Watch can measure your heart rate continuously.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyelen.breathe
        TARGETED_DEVICE_FAMILY: "1"

  BreatheWatch:
    type: application
    platform: watchOS
    sources:
      - BreatheWatch
      - Shared
    scheme: {}
    entitlements:
      path: BreatheWatch/BreatheWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: BreatheWatch/Info.plist
      properties:
        CFBundleDisplayName: Breathe
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jyelen.breathe
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Breathe reads your heart rate, heart rate variability, resting heart rate, respiratory rate and steps to detect early signs of stress on your wrist.
        NSHealthUpdateUsageDescription: Breathe saves monitoring sessions as workouts so it can measure your heart rate continuously.
        NSMotionUsageDescription: Breathe checks your recent step count so it can tell stress apart from normal physical activity.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jyelen.breathe.watchkitapp
